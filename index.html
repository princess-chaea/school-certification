<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <!-- 폰 브라우저(삼성 인터넷·크롬)의 강제 다크모드가 픽셀 아이콘·색을 뒤집지 않게:
         삼성 인터넷은 'only light'를 무시하고, 사이트가 다크 지원을 밝혀야 강제 변환을 멈춤.
         실제 화면 색은 styles.css 에서 직접 지정해 늘 밝게 유지 -->
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/HakgyoansimPosterB.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/KERISBAEUM-B.woff2" as="font" type="font/woff2" crossorigin />
    <title>학교장 인증제</title>
    <meta name="description" content="스스로 도전하고, 기록하고, 성장을 눈으로 확인해요." />
    <!-- 링크 공유 미리보기 (카카오톡·문자·SNS): 금메달 대표 이미지 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="학교장 인증제" />
    <meta property="og:title" content="학교장 인증제" />
    <meta property="og:description" content="스스로 도전하고, 기록하고, 성장을 눈으로 확인해요." />
    <meta property="og:url" content="https://school-certification.vercel.app/" />
    <meta property="og:image" content="https://school-certification.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="금메달과 학교장 인증제" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://school-certification.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
