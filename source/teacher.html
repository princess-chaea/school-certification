<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>화북초 학교장 인증 시스템 - 교사 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Sans KR', sans-serif; 
      margin: 0; 
      padding: 0; 
      background-color: #f4f4f4; 
      color: #333; 
    }
    .container { 
      max-width: 960px; /* 대시보드에 맞게 최대 너비 증가 */
      margin: 20px auto; 
      background-color: #fff; 
      border-radius: 10px; 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
      overflow: hidden; 
      padding-bottom: 20px;
    }
    header { 
      background-color: #4CAF50; 
      color: white; 
      padding: 20px; 
      text-align: center; 
      border-bottom: 5px solid #45a049; 
    }
    header h1 { 
      margin: 0; 
      font-size: 1.8em; 
    }
    .page-title-section {
      background-color: #f0f0f0;
      padding: 15px 20px;
      margin-top: 0;
      font-weight: bold;
      color: #444;
      border-left: 5px solid #337ab7;
      font-size: 1.2em;
      text-align: center;
    }
    .content-section {
      padding: 20px;
    }
    .section-header {
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
      margin-top: 30px;
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
      padding-bottom: 5px;
    }

    /* 요약 통계 카드 그리드 */
    .summary-stats-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-around;
        margin-bottom: 30px;
    }
    .summary-stat-card {
        background-color: #e8f5e9; /* 연한 녹색 배경 */
        border-radius: 8px;
        padding: 15px 20px;
        flex: 1;
        min-width: 180px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        border: 1px solid #c8e6c9;
    }
    .summary-stat-card h4 {
        margin: 0 0 5px;
        font-size: 1.1em;
        color: #4CAF50;
    }
    .summary-stat-card p {
        margin: 0;
        font-size: 1.8em;
        font-weight: bold;
        color: #333;
    }

    /* 학생별 성장 카드 그리드 */
    .student-growth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* 카드 너비 조정 */
      gap: 20px;
      margin-top: 20px;
    }
    .student-growth-card {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer; /* 클릭 가능하도록 */
    }
    .student-growth-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    .student-growth-card h3 {
        margin: 0 0 10px;
        font-size: 1.3em;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: space-between; /* 이름과 학년 사이 공간 */
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
    }
    .student-growth-card h3 span.grade {
        font-size: 0.8em;
        color: #777;
    }
    .student-growth-card p {
        margin: 5px 0;
        line-height: 0; /* 기본보다 좁게 설정 */
        font-size: 0.95em;
        color: #555;
    }
    .student-growth-card strong {
        color: #E65100; /* 포인트 강조 */
        font-weight: bold;
    }
    .student-growth-card .medals {
        margin-top: 10px;
        font-size: 0.9em;
        color: #666;
        display: flex;
        justify-content: space-around;
        padding-top: 10px;
        border-top: 1px dashed #eee; /* 메달 정보 구분선 */
    }
    .student-growth-card .medal-item {
        text-align: center;
        flex: 1;
    }
    .student-growth-card .medal-item strong {
        display: block;
        font-size: 1.1em;
        margin-top: 3px;
    }
    .student-growth-card .medal-item.gold strong { color: gold; }
    .student-growth-card .medal-item.silver strong { color: silver; }
    .student-growth-card .medal-item.bronze strong { color: #CD7F32; }

    /* 로딩 및 빈 상태 메시지 */
    #dashboard-content p, #request-list p {
      text-align: center;
      color: #777;
      font-size: 1.1em;
      padding: 20px;
    }
    #request-list {
      margin-top: 30px; /* 요청 목록 위 여백 */
    }

    /* 카드 스타일 (기존 요청 카드와 동일) */
    .request-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .request-card:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .request-card h3 { 
      margin: 0 0 5px; 
      font-size: 1.1em;
      color: #333;
    }
    .request-card p {
      margin: 3px 0;
      font-size: 0.9em;
      color: #555;
    }
    .request-card p strong {
      color: #E65100; /* 포인트 강조 색상 */
    }
    .request-card .btn-group { 
      display: flex; 
      gap: 10px; 
      margin-top: 15px; 
      justify-content: flex-end; 
    }
    .request-card button {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .request-card .approve { 
      background: #4CAF50; 
      color: white; 
    }
    .request-card .approve:hover { 
      background: #45a049; 
    }
    .request-card .reject { 
      background: #f44336; 
      color: white; 
    }
    .request-card .reject:hover { 
      background: #d32f2f; 
    }
    /* 스피너 스타일 */
    .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #4CAF50;
        animation: spin 1s ease infinite;
        margin: 20px auto;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    /* 피드백 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: none; /* 평소에는 숨김 */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content textarea {
      width: 100%;
      box-sizing: border-box; /* 패딩과 테두리를 너비에 포함시켜 레이아웃 깨짐 방지 */
      height: 120px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: 'Noto Sans KR', sans-serif;
      resize: vertical;
    }
    .modal-buttons {
      margin-top: 15px;
      text-align: right;
    }
    .modal-buttons button {
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    .modal-cancel-btn {
      background-color: #999;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-save-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>성.실.함(성장 실천 함께) 화북초 학교장 인증제</h1>
    </header>

    <div class="page-title-section">
      <span id="teacherNameDisplay">교사</span> 선생님 페이지 - 교사 대시보드
    </div>

    <div class="content-section" id="dashboard-content">
      <div id="loading-spinner" class="spinner" style="display: none;"></div>
      <p id="loading-message">데이터를 불러오는 중...</p>

      <div class="section-header">요약 통계</div>
      <div class="summary-stats-grid" id="summaryStatsGrid">
        <div class="summary-stat-card">
          <h4>학급 학생 수</h4>
          <p id="totalStudentsCount">0명</p>
        </div>
        <div class="summary-stat-card">
          <h4>대기 중 요청</h4>
          <p id="pendingRequestsCount">0건</p>
        </div>
        <div class="summary-stat-card">
          <h4>총 획득 포인트 (학급 학생)</h4>
          <p id="totalEarnedPointsAllStudents">0점</p>
        </div>
      </div>

      <div class="section-header">활동 및 포인트 추이</div>
      <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 30px;">
        <div style="flex: 1; min-width: 300px; max-width: 450px; background-color: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
          <h3>미션 카테고리별 인증 횟수</h3>
          <canvas id="categoryChartCanvas"></canvas> </div>
        <div style="flex: 1; min-width: 300px; max-width: 450px; background-color: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
          <h3>월별 총 획득 포인트</h3>
          <canvas id="monthlyPointsChartCanvas"></canvas> </div>
      </div>

      <div class="section-header">학급 학생 성장 현황</div>
      <div class="student-growth-grid" id="studentGrowthGrid">
        </div>


      <div class="section-header">포인트 사용 요청 승인</div>
      <div id="request-list">
        </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyQvZI-_Kiv0fl1UHLFjmOwpJAHi_XS-2fuAswc7ZeJ2cfVTMT53WF5EIx38sHqt_JA/exec"; 
    const urlParams = new URLSearchParams(window.location.search);
    const teacher = '<?= teacher ?>';

    // 교사 이름 표시
    document.getElementById('teacherNameDisplay').textContent = teacher ? teacher : "교사";

    // 로딩 인디케이터 제어
    const loadingSpinner = document.getElementById('loading-spinner');
    const loadingMessage = document.getElementById('loading-message');
    const dashboardContent = document.getElementById('dashboard-content');

    function showLoading() {
      loadingSpinner.style.display = 'block';
      loadingMessage.style.display = 'block';
      dashboardContent.style.opacity = '0.5'; // 콘텐츠를 흐리게 표시
      dashboardContent.style.pointerEvents = 'none'; // 클릭 방지
    }

    function hideLoading() {
      loadingSpinner.style.display = 'none';
      loadingMessage.style.display = 'none';
      dashboardContent.style.opacity = '1';
      dashboardContent.style.pointerEvents = 'auto';
    }

    let currentFeedbackStudent = { name: '', grade: '' };

    function openFeedbackModal(name, grade) {
      event.stopPropagation(); // 카드 전체가 클릭되는 것을 방지
      currentFeedbackStudent.name = name;
      currentFeedbackStudent.grade = grade;
      document.getElementById('feedbackModalTitle').textContent = `${grade}학년 ${name} 학생 피드백 작성`;
      document.getElementById('feedbackTextarea').value = '';
      document.getElementById('feedbackModal').style.display = 'flex';
    }

    function formatKoreanDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleString('ko-KR', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false, timeZone: 'Asia/Seoul'
      });
    }

    function closeFeedbackModal() {
      document.getElementById('feedbackModal').style.display = 'none';
    }

    async function submitFeedback() {
      const feedbackText = document.getElementById('feedbackTextarea').value;
      if (!feedbackText.trim()) {
        showConfirmModal('⚠️ 피드백 내용을 입력해주세요.');
        return;
      }

      const studentName = currentFeedbackStudent.name;
      const studentGrade = currentFeedbackStudent.grade;

      const saveButton = event.target;
      saveButton.disabled = true;
      saveButton.textContent = '저장 중...';

      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveStudentFeedback',
            studentName,
            studentGrade,
            feedbackText,
            teacherName: teacher
          })
        });

        const result = await res.json();

        if (result.status === 'success') {
          showConfirmModal('✅ 피드백이 성공적으로 저장되었습니다.');
          closeFeedbackModal();
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        console.error('피드백 저장 실패:', error);
        showConfirmModal('❌ 피드백 저장 실패: ' + error.message);
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = '저장';
      }
    }


    // --- loadDashboardData 함수 수정: 차트 데이터 로드 추가 ---
    async function loadDashboardData() {
      showLoading();
      try {
        const [studentsStatsRes, pendingRequestsRes, imageMapRes, categoryCountsRes, monthlyPointsRes] = await Promise.all([ // ✅ 새로운 API 호출 추가
          fetch(`${WEB_APP_URL}?getTeacherStudentsStats=true&teacher=${encodeURIComponent(teacher)}`),
          fetch(`${WEB_APP_URL}?getPendingRequests=true&teacher=${encodeURIComponent(teacher)}`),
          fetch(`${WEB_APP_URL}?getStudentImageMap=true`),
          fetch(`${WEB_APP_URL}?getTeacherCategoryCounts=true&teacher=${encodeURIComponent(teacher)}`), // ✅ 카테고리 카운트 호출
          fetch(`${WEB_APP_URL}?getTeacherMonthlyPoints=true&teacher=${encodeURIComponent(teacher)}`) // ✅ 월별 포인트 호출
        ]);

        const studentsStats = await studentsStatsRes.json();
        const pendingRequests = await pendingRequestsRes.json();
        const imageMap = await imageMapRes.json(); 
        const categoryCounts = await categoryCountsRes.json(); // ✅ 데이터 파싱
        const monthlyPoints = await monthlyPointsRes.json(); // ✅ 데이터 파싱

        renderSummaryStats(studentsStats, pendingRequests.length);
        renderStudentGrowthCards(studentsStats, imageMap);
        renderCharts(categoryCounts, monthlyPoints); // ✅ 차트 렌더링 함수 호출
        renderRequests(pendingRequests);

      } catch (error) {
        console.error("대시보드 데이터 로드 중 오류 발생:", error);
        document.getElementById('studentGrowthGrid').innerHTML = "<p>데이터를 불러오는 데 실패했습니다.</p>";
        document.getElementById('request-list').innerHTML = "<p>요청 데이터를 불러오는 데 실패했습니다.</p>";
      } finally {
        hideLoading();
      }
    }

    // --- 차트 렌더링 함수 ---
    function renderCharts(categoryCounts, monthlyPoints) {
        // 미션 카테고리별 인증 횟수 차트
        const categoryLabels = Object.keys(categoryCounts);
        const categoryValues = Object.values(categoryCounts);

        // ✅ 막대마다 다른 색상을 위한 색상 배열 정의
        const barColors = [
            'rgba(255, 99, 132, 0.7)',  // 빨강
            'rgba(54, 162, 235, 0.7)',  // 파랑
            'rgba(255, 206, 86, 0.7)',  // 노랑
            'rgba(75, 192, 192, 0.7)',  // 청록
            'rgba(153, 102, 255, 0.7)', // 보라
            'rgba(255, 159, 64, 0.7)',  // 주황
            'rgba(199, 199, 199, 0.7)', // 회색
            'rgba(83, 109, 254, 0.7)',  // 밝은 파랑
            'rgba(255, 64, 129, 0.7)'   // 진한 빨강
            // 더 많은 카테고리가 있다면 여기에 색상을 추가하세요.
            // 색상 배열의 길이가 카테고리 수보다 짧으면, 배열의 색상이 반복됩니다.
        ];

        // ✅ 테두리 색상도 필요하다면 유사하게 정의
        const borderColors = [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 206, 86, 1)',
            'rgba(75, 192, 192, 1)',
            'rgba(153, 102, 255, 1)',
            'rgba(255, 159, 64, 1)',
            'rgba(199, 199, 199, 1)',
            'rgba(83, 109, 254, 1)',
            'rgba(255, 64, 129, 1)'
        ];


        if (categoryChartInstance) categoryChartInstance.destroy();
        const ctxCategory = document.getElementById('categoryChartCanvas').getContext('2d');
        categoryChartInstance = new Chart(ctxCategory, {
            type: 'bar',
            data: {
                labels: categoryLabels,
                datasets: [{
                    label: '인증 횟수',
                    data: categoryValues,
                    // ✅ 이 부분을 수정: 단일 색상 대신 배열을 전달
                    backgroundColor: barColors,
                    borderColor: borderColors, // ✅ 테두리 색상도 배열로 전달
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 }
                    }
                }
            }
        });

        // 월별 총 획득 포인트 차트
        const filteredMonthlyPoints = monthlyPoints.filter(item => {
            const [year, month] = item.month.split('-').map(Number);
            return month >= 6;  // 6월부터 포함
        });
        const monthlyLabels = filteredMonthlyPoints.map(item => item.month);
        const monthlyValues = filteredMonthlyPoints.map(item => item.points);

        if (monthlyPointsChartInstance) monthlyPointsChartInstance.destroy(); // 기존 차트 파괴
        const ctxMonthly = document.getElementById('monthlyPointsChartCanvas').getContext('2d');
        monthlyPointsChartInstance = new Chart(ctxMonthly, {
            type: 'line', // 선 차트
            data: {
                labels: monthlyLabels,
                datasets: [{
                    label: '획득 포인트',
                    data: monthlyValues,
                    backgroundColor: 'rgba(255, 159, 64, 0.7)',
                    borderColor: 'rgba(255, 159, 64, 1)',
                    borderWidth: 2,
                    fill: true, // 선 아래 영역 채우기
                    tension: 0.3 // 선 부드럽게
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 10 } // 포인트 단위 (조절 가능)
                    }
                }
            }
        });
    }

    function renderSummaryStats(studentsStats, pendingCount) {
        const totalStudentsCount = document.getElementById('totalStudentsCount');
        const pendingRequestsCount = document.getElementById('pendingRequestsCount');
        const totalEarnedPointsAllStudents = document.getElementById('totalEarnedPointsAllStudents');

        totalStudentsCount.textContent = `${studentsStats.length}명`;
        pendingRequestsCount.textContent = `${pendingCount}건`;
        
        const totalPointsSum = studentsStats.reduce((sum, student) => sum + student.totalPoint, 0);
        totalEarnedPointsAllStudents.textContent = `${totalPointsSum}점`;
    }


    function renderStudentGrowthCards(studentsStats, imageMap) {
      const container = document.getElementById("studentGrowthGrid");
      container.innerHTML = "";

      if (!studentsStats || studentsStats.length === 0) {
        container.innerHTML = "<p>담당 학생 정보가 없습니다.</p>";
        return;
      }

      studentsStats.forEach(student => {
        const card = document.createElement("div");
        card.className = "student-growth-card";

        const imgUrl = imageMap[student.name];
        const hasImage = !!imgUrl;

        card.innerHTML = `
          <h3>
            ${student.name} <span class="grade">(${student.grade}학년)</span>
            ${hasImage
              ? `<img src="${imgUrl}" alt="학생 사진" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:1px solid #ddd;">`
              : `<div style="width:40px; height:40px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-size:0.7em; color:#888;">사진 없음</div>`
            }
          </h3>
          <p>총 획득 포인트: <strong>${student.totalPoint}점</strong></p>
          <p>사용 가능 포인트: <strong>${student.availablePoints}점</strong></p>
          <p>총 제출 횟수: ${student.totalSubmissionCount}회</p>
          <p>총 접속 일수: ${student.loginCount}일</p>
          <div class="medals">
            <div class="medal-item gold">금장<br><strong>🥇 ${student.gold}</strong></div>
            <div class="medal-item silver">은장<br><strong>🥈 ${student.silver}</strong></div>
            <div class="medal-item bronze">동장<br><strong>🥉 ${student.bronze}</strong></div>
          </div>
          <div style="text-align: right; margin-top: 15px;">
            <button onclick="openFeedbackModal('${student.name}', '${student.grade}')" style="background-color: #337ab7; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer;">피드백 작성</button>
          </div>
          `;
        
        // 학생 개인 페이지로 이동하는 클릭 이벤트 (main.html과 유사)
        card.onclick = () => {
          const studentPageUrl = `${WEB_APP_URL}?name=${encodeURIComponent(student.name)}&grade=${encodeURIComponent(student.grade)}`;
          window.open(studentPageUrl, "_blank");
        };

        container.appendChild(card);
      });
    }

    // 기존 loadRequests 함수를 renderRequests를 호출하도록 변경
    async function loadRequests() {
      // 이 함수는 loadDashboardData에서 호출되므로, 여기서는 직접 로딩 스피너를 제어하지 않습니다.
      try {
        const res = await fetch(`${WEB_APP_URL}?getPendingRequests=true&teacher=${encodeURIComponent(teacher)}`);
        const data = await res.json();
        renderRequests(data); // 렌더링 함수로 전달
      } catch (error) {
        console.error("포인트 요청 로드 중 오류 발생:", error);
        document.getElementById('request-list').innerHTML = "<p>요청 데이터를 불러오는 데 실패했습니다.</p>";
      }
    }

    function renderRequests(list) {
      const container = document.getElementById("request-list");

      if (!list || list.length === 0) {
        container.innerHTML = "<p>요청된 항목이 없습니다.</p>";
        return;
      }

      // 버튼에 inline onclick 쓰지 말고 data-*로 안전하게 넣기
      container.innerHTML = list.map(item => `
        <div class="request-card">
          <h3>${item.grade}학년 ${item.name} 학생 - ${escapeHtml(item.itemName)}</h3>
          <p>요청 포인트: <strong>${item.point}점</strong></p>
          <p>요청 시각: ${formatKoreanDate(item.requestedAt)}</p>
          <div class="btn-group">
            <button class="approve"
                    data-name="${encodeURIComponent(item.name)}"
                    data-item="${encodeURIComponent(item.itemName)}"
                    data-approve="true">승인</button>
            <button class="reject"
                    data-name="${encodeURIComponent(item.name)}"
                    data-item="${encodeURIComponent(item.itemName)}"
                    data-approve="false">거절</button>
          </div>
        </div>
      `).join('');

      // 이벤트 위임: 한 번만 바인딩
      if (!container.__bound) {
        container.addEventListener('click', async (e) => {
          const btn = e.target.closest('button.approve, button.reject');
          if (!btn) return;

          const name = decodeURIComponent(btn.dataset.name || '');
          const itemName = decodeURIComponent(btn.dataset.item || '');
          const approve = btn.dataset.approve === 'true';

          await respondWithSafeFetch(btn, name, itemName, approve);
        });
        container.__bound = true;
      }
    }

    // 간단한 HTML escape 유틸
    function escapeHtml(str = "") {
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'", '&#39;');
    }

    function showConfirmModal(message) {
      document.getElementById('confirmModalTitle').textContent = "처리 결과";
      document.getElementById('confirmModalMessage').textContent = message;
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').style.display = 'none';
    }

    async function respondWithSafeFetch(buttonEl, name, itemName, approve) {
      const originalText = buttonEl.textContent;
      buttonEl.textContent = '처리 중...';
      buttonEl.disabled = true;

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "approvePointRequest", name, itemName, approve })
        });
        const result = await res.json();
        if (result.status === "success") {
          showConfirmModal(`${approve ? '승인' : '거절'} 처리 완료`);
        } else {
          showConfirmModal(`처리 실패: ${result.message || '알 수 없는 오류'}`);
        }
        loadDashboardData();
      } catch (error) {
        console.error("요청 응답 중 오류 발생:", error);
        showConfirmModal(`요청 처리 중 오류 발생: ${error.message}`);
      } finally {
        buttonEl.textContent = originalText;
        buttonEl.disabled = false;
      }
    }

    // 차트 인스턴스를 저장할 전역 변수
    let categoryChartInstance = null;
    let monthlyPointsChartInstance = null;



    // 페이지 로드 시 모든 대시보드 데이터 불러오기
    document.addEventListener("DOMContentLoaded", loadDashboardData);
  </script>
  <div id="feedbackModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="feedbackModalTitle">학생 피드백 작성</h3>
      <textarea id="feedbackTextarea" placeholder="학생에게 전달할 피드백을 입력하세요..."></textarea>
      <div class="modal-buttons">
        <button class="modal-save-btn" onclick="submitFeedback()">저장</button>
        <button class="modal-cancel-btn" onclick="closeFeedbackModal()">취소</button>
      
      </div>
    </div>
  </div>
  <!-- ✅ 추가: 승인/거절 처리 결과 모달 -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="confirmModalTitle">처리 결과</h3>
      <p id="confirmModalMessage"></p>
      <div class="modal-buttons">
        <button onclick="closeConfirmModal()" style="background-color: #4CAF50; color: white;">확인</button>
      </div>
    </div>
  </div>
</body>
</html>
